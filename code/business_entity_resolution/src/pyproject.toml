[project]
name = "entilink"
description = "A python library for accurate and scaleable data deduplication and entity-resolution"
version = "3.0.3"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
keywords = []
authors = [
  { name = "Forest Gregg", email = "fgregg@datamade.us" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Programming Language :: Cython",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "scikit-learn",
    "affinegap>=1.3",
    "categorical-distance>=1.9",
    "numpy>=1.20",
    "doublemetaphone",
    "highered>=0.2.0",
    "simplecosine>=1.2",
    "haversine>=0.4.1",
    "BTrees>=4.1.4",
    "zope.index",
    "dedupe_Levenshtein_search",
]

# NOTE: this fork has no public homepage/issue tracker of its own, so the
# upstream [project.urls] metadata block (which pointed at dedupeio/dedupe's
# GitHub, docs, and mailing list) has been removed rather than left pointing
# at incorrect or nonexistent EntiLink URLs. See README.md for attribution
# to the original `dedupe` project this engine is built on.


[build-system]
requires = ["setuptools",
            "wheel",
            "cython"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["entilink", "entilink.variables"]

[tool.setuptools.package-data]
entilink = ["py.typed"]

[tool.mypy]
plugins = "numpy.typing.mypy_plugin"
files = ["entilink"]
show_error_codes = true
ignore_missing_imports = true
check_untyped_defs = true
implicit_reexport = false

[tool.pytest.ini_options]
minversion = "7.1"
addopts = "--cov entilink --cov-report xml"
testpaths = ["tests", "entilink"]

[tool.isort]
profile = "black"
src_paths = ["entilink", "tests", "benchmarks"]

[tool.coverage.run]
omit = ["entilink/backport.py"]
source = ["entilink"]
